[project]
name = "bls_pipeline"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "adbc-driver-postgresql>=1.13.0",
    "dagster==1.13.31",
    "dagster-postgres>=0.29.31",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bls_pipeline"
registry_modules = [
    "bls_pipeline.components.*",
]


